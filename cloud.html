<div id="cloudBotLauncher">

<style>

#cloudBotLauncher {
    width: 100%;
    max-width: 1050px;
    margin: 35px auto;
    font-family: Arial, Helvetica, sans-serif;
    color: #ddd;
    position: relative;
}

#cloudBotLauncher * {
    box-sizing: border-box;
}

/* ================================
   WINDOW
================================ */

.cloud-editor {
    overflow: hidden;
    border: 1px solid #292929;
    border-radius: 10px;
    background: #0b0b0b;
    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.03);
}

/* ================================
   TOP BAR
================================ */

.cloud-topbar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: #111;
    border-bottom: 1px solid #252525;

    cursor: grab;
    user-select: none;
}

.cloud-topbar:active {
    cursor: grabbing;
}

.cloud-dots {
    display: flex;
    gap: 6px;
    margin-right: 14px;
}

.cloud-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #333;
}

.cloud-title {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    color: #888;
}

    color: #bbb;
}

/* ================================
   ADD BOT
================================ */

#cloudBotAdd {
    margin-left: auto;

    height: 28px;

    border: 1px solid #333;
    border-radius: 5px;

}

/* ================================
   MAIN LAYOUT
================================ */

    height: 500px;
    min-height: 500px;

/* ================================
   SCRIPT SIDEBAR
================================ */

.cloud-sidebar {
    width: 210px;

.cloud-sidebar-head {

    display: flex;

    font-weight: 700;

}

#cloudNewScript {

    width: 25px;
    height: 25px;

    border: 1px solid #303030;

    background: #171717;
    color: #aaa;

    font-size: 16px;
    line-height: 20px;

}

#cloudNewScript:hover {

    color: #fff;

.cloud-script-list {

    padding: 7px;
}

.cloud-script-item {

    display: flex;
    align-items: center;

    padding: 0 8px;

    margin-bottom: 3px;

    border: 1px solid transparent;
    border-radius: 5px;

    color: #777;

    font-family: Consolas, monospace;
    font-size: 11px;

    cursor: pointer;

}

.cloud-script-item:hover {

}

.cloud-script-item.active {

}

#cloudBotPlace {

#cloudBotScript {

}

/* ================================
   BOTTOM
================================ */

.cloud-bottom {
    display: flex;

}

#cloudBotStatus {

    }

<script>

(function () {

    "use strict";


    /* ==========================================
       STORAGE
    ========================================== */

    const STORAGE_KEY =
        "cloud_executor_scripts_v2";


    let scripts = [];

    let activeScriptId = null;


    /* ==========================================
       ELEMENTS
    ========================================== */

    const scriptList =
        document.getElementById(
            "cloudScriptList"
        );

    const tabs =
        document.getElementById(
            "cloudTabs"
        );

    const editor =
        document.getElementById(
            "cloudBotScript"
        );

    const lines =
        document.getElementById(
            "cloudBotLines"
        );

    const status =
        document.getElementById(
            "cloudBotStatus"
        );

    const newScriptButton =
        document.getElementById(
            "cloudNewScript"
        );

    const saveButton =
        document.getElementById(
            "cloudSave"
        );

    const copyButton =
        document.getElementById(
            "cloudCopy"
        );

    const downloadButton =
        document.getElementById(
            "cloudDownload"
        );

    const importButton =
        document.getElementById(
            "cloudImport"
        );

    const renameButton =
        document.getElementById(
            "cloudRename"
        );

    const clearButton =
        document.getElementById(
            "cloudClear"
        );

    const fileInput =
        document.getElementById(
            "cloudFileInput"
        );

    const addBot =
        document.getElementById(
            "cloudBotAdd"
        );


    /* ==========================================
       ID
    ========================================== */

    function createId() {

        return (
            Date.now().toString(36) +
            "_" +
            Math.random()
                .toString(36)
                .slice(2)
        );

    }


    /* ==========================================
       DEFAULT SCRIPT
    ========================================== */

    function defaultScript() {

        return {

            id: createId(),

            name: "script.lua",

            code:
`-- Cloud

print("Hello, Roblox!")

`

        };

    }


    /* ==========================================
       LOAD
    ========================================== */

    function loadScripts() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!saved) {

                scripts = [
                    defaultScript()
                ];

                activeScriptId =
                    scripts[0].id;

                saveScripts();

                return;

            }

            const data =
                JSON.parse(saved);

            if (
                !data ||
                !Array.isArray(
                    data.scripts
                ) ||
                !data.scripts.length
            ) {

                throw new Error(
                    "Invalid saved data"
                );

            }

            scripts =
                data.scripts;

            activeScriptId =
                data.activeScriptId;

            if (
                !scripts.some(
                    function (script) {
                        return script.id ===
                            activeScriptId;
                    }
                )
            ) {

                activeScriptId =
                    scripts[0].id;

            }

        } catch (error) {

            console.warn(
                "Cloud storage reset:",
                error
            );

            scripts = [
                defaultScript()
            ];

            activeScriptId =
                scripts[0].id;

        }

    }


    /* ==========================================
       SAVE
    ========================================== */

    function saveScripts() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({

                    scripts: scripts,

                    activeScriptId:
                        activeScriptId

                })
            );

        } catch (error) {

            console.error(
                "Unable to save Cloud scripts:",
                error
            );

            setStatus(
                "● STORAGE ERROR",
                "error"
            );

        }

    }


    /* ==========================================
       ACTIVE SCRIPT
    ========================================== */

    function getActiveScript() {

        return scripts.find(
            function (script) {

                return script.id ===
                    activeScriptId;

            }
        );

    }


    /* ==========================================
       SAVE CURRENT EDITOR
    ========================================== */

    function saveCurrentEditor() {

        const active =
            getActiveScript();

        if (!active) {
            return;
        }

        active.code =
            editor.value;

        saveScripts();

    }


    /* ==========================================
       STATUS
    ========================================== */

    function setStatus(
        text,
        type
    ) {

        status.textContent =
            text;

        status.className =
            type || "";

    }


    /* ==========================================
       LINE NUMBERS
    ========================================== */

    function updateLines() {

        const count =
            Math.max(
                1,
                editor.value
                    .split("\n")
                    .length
            );

        let output = "";

        for (
            let i = 1;
            i <= count;
            i++
        ) {

            output += i;

            if (i < count) {
                output += "<br>";
            }

        }

        lines.innerHTML =
            output;

    }


    /* ==========================================
       RENDER SCRIPTS
    ========================================== */

    function renderScripts() {

        scriptList.innerHTML = "";

        scripts.forEach(
            function (script) {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "cloud-script-item" +
                    (
                        script.id ===
                        activeScriptId
                            ? " active"
                            : ""
                    );


                const icon =
                    document.createElement(
                        "span"
                    );

                icon.className =
                    "cloud-script-icon";

                icon.textContent =
                    "◇";


                const name =
                    document.createElement(
                        "span"
                    );

                name.className =
                    "cloud-script-name";

                name.textContent =
                    script.name;


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "cloud-script-delete";

                deleteButton.type =
                    "button";

                deleteButton.textContent =
                    "×";

                deleteButton.title =
                    "Delete script";


                deleteButton.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();

                        deleteScript(
                            script.id
                        );

                    }
                );


                item.appendChild(icon);
                item.appendChild(name);
                item.appendChild(
                    deleteButton
                );


                item.addEventListener(
                    "click",
                    function () {

                        switchScript(
                            script.id
                        );

                    }
                );


                scriptList.appendChild(
                    item
                );

            }
        );

    }


    /* ==========================================
       RENDER TAB
    ========================================== */

    function renderTabs() {

        tabs.innerHTML = "";

        const active =
            getActiveScript();

        if (!active) {
            return;
        }

        const tab =
            document.createElement(
                "div"
            );

        tab.className =
            "cloud-tab active";


        const dot =
            document.createElement(
                "span"
            );

        dot.className =
            "cloud-tab-dot";


        const name =
            document.createElement(
                "span"
            );

        name.textContent =
            active.name;


        tab.appendChild(dot);
        tab.appendChild(name);

        tabs.appendChild(tab);

    }


    /* ==========================================
       RENDER EDITOR
    ========================================== */

    function renderEditor() {

        const active =
            getActiveScript();

        if (!active) {

            editor.value =
                "";

            updateLines();

            return;

        }

        editor.value =
            active.code || "";

        updateLines();

    }


    /* ==========================================
       FULL RENDER
    ========================================== */

    function render() {

        renderScripts();

        renderTabs();

        renderEditor();

    }


    /* ==========================================
       NEW SCRIPT
    ========================================== */

    function createScript() {

        saveCurrentEditor();


        let name =
            prompt(
                "Enter script name:",
                "script" +
                (scripts.length + 1) +
                ".lua"
            );


        if (name === null) {
            return;
        }


        name =
            name.trim();


        if (!name) {

            name =
                "script" +
                (scripts.length + 1) +
                ".lua";

        }


        if (
            !/\.lua$/i.test(name)
        ) {

            name += ".lua";

        }


        const script = {

            id: createId(),

            name: name,

            code:
`-- ${name}

`

        };


        scripts.push(
            script
        );


        activeScriptId =
            script.id;


        saveScripts();

        render();

        editor.focus();

        setStatus(
            "● NEW SCRIPT",
            "success"
        );

    }


    /* ==========================================
       SWITCH SCRIPT
    ========================================== */

    function switchScript(id) {

        saveCurrentEditor();

        activeScriptId = id;

        saveScripts();

        render();

        editor.focus();

        setStatus(
            "● SCRIPT LOADED",
            "success"
        );

    }


    /* ==========================================
       DELETE SCRIPT
    ========================================== */

    function deleteScript(id) {

        if (scripts.length <= 1) {

            alert(
                "Cloud needs at least one script."
            );

            return;

        }


        const script =
            scripts.find(
                function (item) {
                    return item.id === id;
                }
            );


        if (!script) {
            return;
        }


        const confirmed =
            confirm(
                'Delete "' +
                script.name +
                '"?'
            );


        if (!confirmed) {
            return;
        }


        scripts =
            scripts.filter(
                function (item) {
                    return item.id !== id;
                }
            );


        if (
            activeScriptId === id
        ) {

            activeScriptId =
                scripts[0].id;

        }


        saveScripts();

        render();

        setStatus(
            "● SCRIPT DELETED"
        );

    }


    /* ==========================================
       RENAME
    ========================================== */

    function renameScript() {

        const active =
            getActiveScript();

        if (!active) {
            return;
        }


        let name =
            prompt(
                "Enter new script name:",
                active.name
            );


        if (name === null) {
            return;
        }


        name =
            name.trim();


        if (!name) {
            return;
        }


        if (
            !/\.lua$/i.test(name)
        ) {

            name += ".lua";

        }


        active.name =
            name;


        saveScripts();

        render();

        setStatus(
            "● RENAMED",
            "success"
        );

    }


    /* ==========================================
       SAVE BUTTON
    ========================================== */

    saveButton.addEventListener(
        "click",
        function () {

            saveCurrentEditor();

            renderScripts();
            renderTabs();

            setStatus(
                "● SAVED LOCALLY",
                "success"
            );

        }
    );


    /* ==========================================
       AUTO SAVE
    ========================================== */

    let saveTimer = null;


    editor.addEventListener(
        "input",
        function () {

            const active =
                getActiveScript();

            if (!active) {
                return;
            }


            active.code =
                editor.value;


            updateLines();


            setStatus(
                "● UNSAVED CHANGES"
            );


            clearTimeout(
                saveTimer
            );


            saveTimer =
                setTimeout(
                    function () {

                        saveScripts();

                        setStatus(
                            "● SAVED LOCALLY",
                            "success"
                        );

                    },
                    500
                );

        }
    );


    /* ==========================================
       CTRL + S
    ========================================== */

    editor.addEventListener(
        "keydown",
        function (event) {

            if (
                (event.ctrlKey ||
                 event.metaKey) &&
                event.key.toLowerCase() === "s"
            ) {

                event.preventDefault();

                saveCurrentEditor();

                setStatus(
                    "● SAVED LOCALLY",
                    "success"
                );

            }

        }
    );


    /* ==========================================
       TAB INSERTION
    ========================================== */

    editor.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key !== "Tab"
            ) {
                return;
            }


            event.preventDefault();


            const start =
                editor.selectionStart;

            const end =
                editor.selectionEnd;


            const value =
                editor.value;


            editor.value =
                value.substring(
                    0,
                    start
                ) +
                "    " +
                value.substring(
                    end
                );


            editor.selectionStart =
                editor.selectionEnd =
                    start + 4;


            editor.dispatchEvent(
                new Event("input")
            );

        }
    );


    /* ==========================================
       SCROLL LINE NUMBERS
    ========================================== */

    editor.addEventListener(
        "scroll",
        function () {

            lines.scrollTop =
                editor.scrollTop;

        }
    );


    /* ==========================================
       COPY
    ========================================== */

    copyButton.addEventListener(
        "click",
        async function () {

            try {

                await navigator.clipboard
                    .writeText(
                        editor.value
                    );

                setStatus(
                    "● COPIED",
                    "success"
                );

            } catch (error) {

                editor.select();

                document.execCommand(
                    "copy"
                );

                editor.setSelectionRange(
                    editor.value.length,
                    editor.value.length
                );

                setStatus(
                    "● COPIED",
                    "success"
                );

            }

        }
    );


    /* ==========================================
       DOWNLOAD
    ========================================== */

    downloadButton.addEventListener(
        "click",
        function () {

            const active =
                getActiveScript();

            if (!active) {
                return;
            }


            saveCurrentEditor();


            const blob =
                new Blob(
                    [active.code],
                    {
                        type:
                            "text/plain;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                active.name;


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            URL.revokeObjectURL(
                url
            );


            setStatus(
                "● DOWNLOADED",
                "success"
            );

        }
    );


    /* ==========================================
       IMPORT
    ========================================== */

    importButton.addEventListener(
        "click",
        function () {

            fileInput.value = "";

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        function () {

            const file =
                fileInput.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function () {

                    saveCurrentEditor();


                    let name =
                        file.name;


                    if (
                        !/\.lua$/i.test(name)
                    ) {

                        name += ".lua";

                    }


                    const imported = {

                        id: createId(),

                        name: name,

                        code:
                            reader.result || ""

                    };


                    scripts.push(
                        imported
                    );


                    activeScriptId =
                        imported.id;


                    saveScripts();

                    render();


                    setStatus(
                        "● IMPORTED",
                        "success"
                    );

                };


            reader.readAsText(
                file
            );

        }
    );


    /* ==========================================
       CLEAR
    ========================================== */

    clearButton.addEventListener(
        "click",
        function () {

            if (!editor.value) {
                return;
            }


            if (
                !confirm(
                    "Clear this script?"
                )
            ) {
                return;
            }


            editor.value =
                "";


            const active =
                getActiveScript();


            if (active) {

                active.code =
                    "";

            }


            saveScripts();

            updateLines();


            setStatus(
                "● CLEARED",
                "success"
            );


            editor.focus();

        }
    );


    /* ==========================================
       NEW SCRIPT BUTTON
    ========================================== */

    newScriptButton.addEventListener(
        "click",
        createScript
    );


    /* ==========================================
       ADD BOT
    ========================================== */

    addBot.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            window.open(
                "https://www.roblox.com/users/11525347845/profile",
                "_blank",
                "noopener,noreferrer"
            );

        }
    );


    /* ==========================================
       DRAGGING
    ========================================== */

    const launcher =
        document.getElementById(
            "cloudBotLauncher"
        );

    const dragHandle =
        document.getElementById(
            "cloudBotDragHandle"
        );


    let dragging = false;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;


    dragHandle.addEventListener(
        "mousedown",
        function (event) {

            if (
                event.button !== 0
            ) {
                return;
            }


            if (
                event.target.closest(
                    "button"
                )
            ) {
                return;
            }


            const rect =
                launcher.getBoundingClientRect();


            dragging = true;


            startX =
                event.clientX;

            startY =
                event.clientY;


            startLeft =
                rect.left;

            startTop =
                rect.top;


            launcher.style.position =
                "fixed";

            launcher.style.left =
                rect.left + "px";

            launcher.style.top =
                rect.top + "px";

            launcher.style.margin =
                "0";

            launcher.style.width =
                rect.width + "px";


            event.preventDefault();

        }
    );


    document.addEventListener(
        "mousemove",
        function (event) {

            if (!dragging) {
                return;
            }


            if (
                (event.buttons & 1) !== 1
            ) {

                dragging = false;

                return;

            }


            const deltaX =
                event.clientX -
                startX;

            const deltaY =
                event.clientY -
                startY;


            let newLeft =
                startLeft +
                deltaX;

            let newTop =
                startTop +
                deltaY;


            const rect =
                launcher.getBoundingClientRect();


            const margin = 10;


            const maxLeft =
                window.innerWidth -
                rect.width -
                margin;


            const maxTop =
                window.innerHeight -
                rect.height -
                margin;


            newLeft =
                Math.max(
                    margin,
                    Math.min(
                        newLeft,
                        maxLeft
                    )
                );


            newTop =
                Math.max(
                    margin,
                    Math.min(
                        newTop,
                        maxTop
                    )
                );


            launcher.style.left =
                newLeft + "px";

            launcher.style.top =
                newTop + "px";

        }
    );


    document.addEventListener(
        "mouseup",
        function (event) {

            if (
                event.button === 0
            ) {

                dragging = false;

            }

        }
    );


    window.addEventListener(
        "blur",
        function () {

            dragging = false;

        }
    );


    /* ==========================================
       INITIALIZE
    ========================================== */

    loadScripts();

    render();

    updateLines();

})();

</script>

</div>
