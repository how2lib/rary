    const bgUploadBtn =
        document.getElementById(
            "cloudBgUploadBtn"
        );

    const bgClearBtn =
        document.getElementById(
            "cloudBgClearBtn"
        );

    function applyCustomBackground(dataUrl) {

        if (!dataUrl) {
            launcher.style.removeProperty(
                "--cloud-custom-bg"
            );
            return;
        }

        launcher.style.setProperty(
            "--cloud-custom-bg",
            "url(" +
            JSON.stringify(dataUrl) +
            ")"
        );
    }

    function saveCustomBackground(dataUrl) {

        try {
            if (dataUrl) {
                localStorage.setItem(
                    CUSTOM_BG_KEY,
                    dataUrl
                );
            } else {
                localStorage.removeItem(
                    CUSTOM_BG_KEY
                );
            }
        } catch (error) {
            console.warn(
                "Unable to save Cloud background:",
                error
            );
        }
    }

    function loadCustomBackground() {

        try {
            const saved =
                localStorage.getItem(
                    CUSTOM_BG_KEY
                );

            if (saved) {
                applyCustomBackground(saved);
            }
        } catch (error) {
            console.warn(
                "Unable to load Cloud background:",
                error
            );
        }
    }

    function setCustomTheme() {
        applyTheme("custom");
    }

    bgUploadBtn.addEventListener(
        "click",
        function () {
            bgFile.click();
        }
    );

    bgClearBtn.addEventListener(
        "click",
        function () {

            applyCustomBackground(null);
            saveCustomBackground(null);

            applyTheme("default");

            setStatus(
                "● CUSTOM BACKGROUND CLEARED",
                "success"
            );
        }
    );

    bgFile.addEventListener(
        "change",
        function () {

            const file =
                bgFile.files &&
                bgFile.files[0];

            if (!file) return;

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {
                setStatus(
                    "● INVALID IMAGE",
                    "error"
                );
                return;
            }

            const reader =
                new FileReader();

            reader.onload = function () {

                const img =
                    new Image();

                img.onload = function () {

                    /*
                     * Resize large images before
                     * saving them to localStorage.
                     * This keeps the embed responsive
                     * and avoids huge storage usage.
                     */
                    const maxSize = 2200;

                    let width = img.naturalWidth;
                    let height = img.naturalHeight;

                    if (
                        width > maxSize ||
                        height > maxSize
                    ) {
                        const scale =
                            Math.min(
                                maxSize / width,
                                maxSize / height
                            );

                        width =
                            Math.round(
                                width * scale
                            );

                        height =
                            Math.round(
                                height * scale
                            );
                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width = width;
                    canvas.height = height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    const dataUrl =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.84
                        );

                    applyCustomBackground(
                        dataUrl
                    );

                    saveCustomBackground(
                        dataUrl
                    );

                    setCustomTheme();

                    setStatus(
                        "● CUSTOM BACKGROUND SET",
                        "success"
                    );
                };

                img.onerror = function () {
                    setStatus(
                        "● IMAGE COULD NOT BE LOADED",
                        "error"
                    );
                };

                img.src = reader.result;
            };

            reader.readAsDataURL(file);
        }
    );

    function applyTheme(theme) {

        const allowedThemes = [
            "default",
            "midnight",
            "slate",
            "purple",
            "emerald",
            "rose",
            "custom"
        ];

        if (!allowedThemes.includes(theme)) {
            theme = "default";
        }

        launcher.setAttribute(
            "data-theme",
            theme
        );

        themeSelect.value = theme;

        try {
            localStorage.setItem(
                THEME_KEY,
                theme
            );
        } catch (error) {
            console.warn(
                "Unable to save Cloud theme:",
                error
            );
        }

    }

    function loadTheme() {

        let theme = "default";

        try {
            theme =
                localStorage.getItem(
                    THEME_KEY
                ) || "default";
        } catch (error) {
            theme = "default";
        }

        let savedCustom = null;

        try {
            savedCustom =
                localStorage.getItem(
                    CUSTOM_BG_KEY
                );
        } catch (error) {
            savedCustom = null;
        }

        if (
            theme === "custom" &&
            !savedCustom
        ) {
            theme = "default";
        }

        applyTheme(theme);
    }

    themeSelect.addEventListener(
        "change",
        function () {

            applyTheme(
                themeSelect.value
            );

            if (
                themeSelect.value === "custom"
            ) {
                loadCustomBackground();
            }

            setStatus(
                "● THEME: " +
                themeSelect.value.toUpperCase(),
                "success"
            );

        }
    );


    /* ==========================================
       ID
    ========================================== */

    function createId() {

        return (
            Date.now().toString(36) +
            "_" +
            Math.random()
                .toString(36)
                .slice(2)
        );

    }


    /* ==========================================
       DEFAULT SCRIPT
    ========================================== */

    function defaultScript() {

        return {

            id: createId(),

            name: "script.lua",

            code:
`-- Cloud

print("Hello, Roblox!")

`

        };

    }


    /* ==========================================
       LOAD
    ========================================== */

    function loadScripts() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!saved) {

                scripts = [
                    defaultScript()
                ];

                activeScriptId =
                    scripts[0].id;

                saveScripts();

                return;

            }

            const data =
                JSON.parse(saved);

            if (
                !data ||
                !Array.isArray(
                    data.scripts
                ) ||
                !data.scripts.length
            ) {

                throw new Error(
                    "Invalid saved data"
                );

            }

            scripts =
                data.scripts;

            activeScriptId =
                data.activeScriptId;

            if (
                !scripts.some(
                    function (script) {
                        return script.id ===
                            activeScriptId;
                    }
                )
            ) {

                activeScriptId =
                    scripts[0].id;

            }

        } catch (error) {

            console.warn(
                "Cloud storage reset:",
                error
            );

            scripts = [
                defaultScript()
            ];

            activeScriptId =
                scripts[0].id;

        }

    }


    /* ==========================================
       SAVE
    ========================================== */

    function saveScripts() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({

                    scripts: scripts,

                    activeScriptId:
                        activeScriptId

                })
            );

        } catch (error) {

            console.error(
                "Unable to save Cloud scripts:",
                error
            );

            setStatus(
                "● STORAGE ERROR",
                "error"
            );

        }

    }


    /* ==========================================
       ACTIVE SCRIPT
    ========================================== */

    function getActiveScript() {

        return scripts.find(
            function (script) {

                return script.id ===
                    activeScriptId;

            }
        );

    }


    /* ==========================================
       SAVE CURRENT EDITOR
    ========================================== */

    function saveCurrentEditor() {

        const active =
            getActiveScript();

        if (!active) {
            return;
        }

        active.code =
            editor.value;

        saveScripts();

    }


    /* ==========================================
       STATUS
    ========================================== */

    function setStatus(
        text,
        type
    ) {

        status.textContent =
            text;

        status.className =
            type || "";

    }


    /* ==========================================
       LINE NUMBERS
    ========================================== */

    function updateLines() {

        const count =
            Math.max(
                1,
                editor.value
                    .split("\n")
                    .length
            );

        let output = "";

        for (
            let i = 1;
            i <= count;
            i++
        ) {

            output += i;

            if (i < count) {
                output += "<br>";
            }

        }

        lines.innerHTML =
            output;

    }


    /* ==========================================
       RENDER SCRIPTS
    ========================================== */

    function renderScripts() {

        scriptList.innerHTML = "";

        scripts.forEach(
            function (script) {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "cloud-script-item" +
                    (
                        script.id ===
                        activeScriptId
                            ? " active"
                            : ""
                    );


                const icon =
                    document.createElement(
                        "span"
                    );

                icon.className =
                    "cloud-script-icon";

                icon.textContent =
                    "◇";


                const name =
                    document.createElement(
                        "span"
                    );

                name.className =
                    "cloud-script-name";

                name.textContent =
                    script.name;


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "cloud-script-delete";

                deleteButton.type =
                    "button";

                deleteButton.textContent =
                    "×";

                deleteButton.title =
                    "Delete script";


                deleteButton.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();

                        deleteScript(
                            script.id
                        );

                    }
                );


                item.appendChild(icon);
                item.appendChild(name);
                item.appendChild(
                    deleteButton
                );


                item.addEventListener(
                    "click",
                    function () {

                        switchScript(
                            script.id
                        );

                    }
                );


                scriptList.appendChild(
                    item
                );

            }
        );

    }


    /* ==========================================
       RENDER TAB
    ========================================== */

    function renderTabs() {

        tabs.innerHTML = "";

        const active =
            getActiveScript();

        if (!active) {
            return;
        }

        const tab =
            document.createElement(
                "div"
            );

        tab.className =
            "cloud-tab active";


        const dot =
            document.createElement(
                "span"
            );

        dot.className =
            "cloud-tab-dot";


        const name =
            document.createElement(
                "span"
            );

        name.textContent =
            active.name;


        tab.appendChild(dot);
        tab.appendChild(name);

        tabs.appendChild(tab);

    }


    /* ==========================================
       RENDER EDITOR
    ========================================== */

    function renderEditor() {

        const active =
            getActiveScript();

        if (!active) {

            editor.value =
                "";

            updateLines();

            return;

        }

        editor.value =
            active.code || "";

        updateLines();

    }


    /* ==========================================
       FULL RENDER
    ========================================== */

    function render() {

        renderScripts();

        renderTabs();

        renderEditor();

    }


    /* ==========================================
       NEW SCRIPT
    ========================================== */

    function createScript() {

        saveCurrentEditor();


        let name =
            prompt(
                "Enter script name:",
                "script" +
                (scripts.length + 1) +
                ".lua"
            );


        if (name === null) {
            return;
        }


        name =
            name.trim();


        if (!name) {

            name =
                "script" +
                (scripts.length + 1) +
                ".lua";

        }


        if (
            !/\.lua$/i.test(name)
        ) {

            name += ".lua";

        }


        const script = {

            id: createId(),

            name: name,

            code:
`-- ${name}

`

        };


        scripts.push(
            script
        );


        activeScriptId =
            script.id;


        saveScripts();

        render();

        editor.focus();

        setStatus(
            "● NEW SCRIPT",
            "success"
        );

    }


    /* ==========================================
       SWITCH SCRIPT
    ========================================== */

    function switchScript(id) {

        saveCurrentEditor();

        activeScriptId = id;

        saveScripts();

        render();

        editor.focus();

        setStatus(
            "● SCRIPT LOADED",
            "success"
        );

    }


    /* ==========================================
       DELETE SCRIPT
    ========================================== */

    function deleteScript(id) {

        if (scripts.length <= 1) {

            alert(
                "Cloud needs at least one script."
            );

            return;

        }


        const script =
            scripts.find(
                function (item) {
                    return item.id === id;
                }
            );


        if (!script) {
            return;
        }


        const confirmed =
            confirm(
                'Delete "' +
                script.name +
                '"?'
            );


        if (!confirmed) {
            return;
        }


        scripts =
            scripts.filter(
                function (item) {
                    return item.id !== id;
                }
            );


        if (
            activeScriptId === id
        ) {

            activeScriptId =
                scripts[0].id;

        }


        saveScripts();

        render();

        setStatus(
            "● SCRIPT DELETED"
        );

    }


    /* ==========================================
       RENAME
    ========================================== */

    function renameScript() {

        const active =
            getActiveScript();

        if (!active) {
            return;
        }


        let name =
            prompt(
                "Enter new script name:",
                active.name
            );


        if (name === null) {
            return;
        }


        name =
            name.trim();


        if (!name) {
            return;
        }


        if (
            !/\.lua$/i.test(name)
        ) {

            name += ".lua";

        }


        active.name =
            name;


        saveScripts();

        render();

        setStatus(
            "● RENAMED",
            "success"
        );

    }


    /* ==========================================
       SAVE BUTTON
    ========================================== */

    saveButton.addEventListener(
        "click",
        function () {

            saveCurrentEditor();

            renderScripts();
            renderTabs();

            setStatus(
                "● SAVED LOCALLY",
                "success"
            );

        }
    );


    /* ==========================================
       AUTO SAVE
    ========================================== */

    let saveTimer = null;


    editor.addEventListener(
        "input",
        function () {

            const active =
                getActiveScript();

            if (!active) {
                return;
            }


            active.code =
                editor.value;


            updateLines();


            setStatus(
                "● UNSAVED CHANGES"
            );


            clearTimeout(
                saveTimer
            );


            saveTimer =
                setTimeout(
                    function () {

                        saveScripts();

                        setStatus(
                            "● SAVED LOCALLY",
                            "success"
                        );

                    },
                    500
                );

        }
    );


    /* ==========================================
       CTRL + S
    ========================================== */

    editor.addEventListener(
        "keydown",
        function (event) {

            if (
                (event.ctrlKey ||
                 event.metaKey) &&
                event.key.toLowerCase() === "s"
            ) {

                event.preventDefault();

                saveCurrentEditor();

                setStatus(
                    "● SAVED LOCALLY",
                    "success"
                );

            }

        }
    );


    /* ==========================================
       TAB INSERTION
    ========================================== */

    editor.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key !== "Tab"
            ) {
                return;
            }


            event.preventDefault();


            const start =
                editor.selectionStart;

            const end =
                editor.selectionEnd;


            const value =
                editor.value;


            editor.value =
                value.substring(
                    0,
                    start
                ) +
                "    " +
                value.substring(
                    end
                );


            editor.selectionStart =
                editor.selectionEnd =
                    start + 4;


            editor.dispatchEvent(
                new Event("input")
            );

        }
    );


    /* ==========================================
       SCROLL LINE NUMBERS
    ========================================== */

    editor.addEventListener(
        "scroll",
        function () {

            lines.scrollTop =
                editor.scrollTop;

        }
    );


    /* ==========================================
       COPY
    ========================================== */

    copyButton.addEventListener(
        "click",
        async function () {

            try {

                await navigator.clipboard
                    .writeText(
                        editor.value
                    );

                setStatus(
                    "● COPIED",
                    "success"
                );

            } catch (error) {

                editor.select();

                document.execCommand(
                    "copy"
                );

                editor.setSelectionRange(
                    editor.value.length,
                    editor.value.length
                );

                setStatus(
                    "● COPIED",
                    "success"
                );

            }

        }
    );


    /* ==========================================
       DOWNLOAD
    ========================================== */

    downloadButton.addEventListener(
        "click",
        function () {

            const active =
                getActiveScript();

            if (!active) {
                return;
            }


            saveCurrentEditor();


            const blob =
                new Blob(
                    [active.code],
                    {
                        type:
                            "text/plain;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                active.name;


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            URL.revokeObjectURL(
                url
            );


            setStatus(
                "● DOWNLOADED",
                "success"
            );

        }
    );


    /* ==========================================
       IMPORT
    ========================================== */

    importButton.addEventListener(
        "click",
        function () {

            fileInput.value = "";

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        function () {

            const file =
                fileInput.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function () {

                    saveCurrentEditor();


                    let name =
                        file.name;


                    if (
                        !/\.lua$/i.test(name)
                    ) {

                        name += ".lua";

                    }


                    const imported = {

                        id: createId(),

                        name: name,

                        code:
                            reader.result || ""

                    };


                    scripts.push(
                        imported
                    );


                    activeScriptId =
                        imported.id;


                    saveScripts();

                    render();


                    setStatus(
                        "● IMPORTED",
                        "success"
                    );

                };


            reader.readAsText(
                file
            );

        }
    );


    /* ==========================================
       CLEAR
    ========================================== */

    clearButton.addEventListener(
        "click",
        function () {

            if (!editor.value) {
                return;
            }


            if (
                !confirm(
                    "Clear this script?"
                )
            ) {
                return;
            }


            editor.value =
                "";


            const active =
                getActiveScript();


            if (active) {

                active.code =
                    "";

            }


            saveScripts();

            updateLines();


            setStatus(
                "● CLEARED",
                "success"
            );


            editor.focus();

        }
    );


    /* ==========================================
       NEW SCRIPT BUTTON
    ========================================== */

    newScriptButton.addEventListener(
        "click",
        createScript
    );


    /* ==========================================
       ADD BOT
    ========================================== */

    addBot.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            window.open(
                "https://www.roblox.com/users/11525347845/profile",
                "_blank",
                "noopener,noreferrer"
            );

        }
    );


    /* ==========================================
       EXECUTE
    ========================================== */

    const WORKER =
        "https://silent-unit-21a3.8nqrblx.workers.dev";

    const WEB_SECRET =
        "PUT_YOUR_WEBSITE_SECRET_HERE";

    const placeInput =
        document.getElementById("cloudBotPlace");

    const launchButton =
        document.getElementById("cloudBotLaunch");

    launchButton.addEventListener(
        "click",
        async function () {

            const placeId =
                placeInput.value.trim();

            const script =
                editor.value;

            if (!placeId) {
                setStatus(
                    "● ENTER A PLACE ID",
                    "error"
                );
                placeInput.focus();
                return;
            }

            if (!/^\d+$/.test(placeId)) {
                setStatus(
                    "● INVALID PLACE ID",
                    "error"
                );
                placeInput.focus();
                return;
            }

            launchButton.disabled = true;
            launchButton.textContent = "EXECUTING...";

            setStatus(
                "● SENDING JOB...",
                ""
            );

            try {
                const response =
                    await fetch(
                        WORKER + "/launch",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Authorization":
                                    "Bearer " + WEB_SECRET
                            },
                            body: JSON.stringify({
                                placeId: placeId,
                                script: script
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.error ||
                        "Worker rejected request"
                    );
                }

                launchButton.textContent = "EXECUTED";

                setStatus(
                    "● JOB QUEUED | PLACE " +
                    data.placeId +
                    " | " +
                    data.jobId,
                    "success"
                );

            } catch (error) {
                console.error(error);

                launchButton.textContent = "ERROR";

                setStatus(
                    "● " +
                    (error.message ||
                        "Execution failed"),
                    "error"
                );
            }

            setTimeout(
                function () {
                    launchButton.disabled = false;
                    launchButton.textContent = "EXECUTE";
                },
                3000
            );
        }
    );

    /* ==========================================
       DRAGGING
    ========================================== */


    const dragHandle =
        document.getElementById(
            "cloudBotDragHandle"
        );


    let dragging = false;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;


    dragHandle.addEventListener(
        "mousedown",
        function (event) {

            if (
                event.button !== 0
            ) {
                return;
            }


            /*
             * Interactive controls in the top bar must
             * not start the window drag. In particular,
             * <select> needs the native mouse event so
             * its dropdown can open normally.
             */
            if (
                event.target.closest(
                    "button, select, input, .cloud-theme-wrap, .cloud-bg-upload"
                )
            ) {
                return;
            }


            const rect =
                launcher.getBoundingClientRect();


            dragging = true;


            startX =
                event.clientX;

            startY =
                event.clientY;


            startLeft =
                rect.left;

            startTop =
                rect.top;


            launcher.style.position =
                "fixed";

            launcher.style.left =
                rect.left + "px";

            launcher.style.top =
                rect.top + "px";

            launcher.style.margin =
                "0";

            launcher.style.width =
                rect.width + "px";


            event.preventDefault();

        }
    );


    document.addEventListener(
        "mousemove",
        function (event) {

            if (!dragging) {
                return;
            }


            if (
                (event.buttons & 1) !== 1
            ) {

                dragging = false;

                return;

            }


            const deltaX =
                event.clientX -
                startX;

            const deltaY =
                event.clientY -
                startY;


            let newLeft =
                startLeft +
                deltaX;

            let newTop =
                startTop +
                deltaY;


            const rect =
                launcher.getBoundingClientRect();


            const margin = 10;


            const maxLeft =
                window.innerWidth -
                rect.width -
                margin;


            const maxTop =
                window.innerHeight -
                rect.height -
                margin;


            newLeft =
                Math.max(
                    margin,
                    Math.min(
                        newLeft,
                        maxLeft
                    )
                );


            newTop =
                Math.max(
                    margin,
                    Math.min(
                        newTop,
                        maxTop
                    )
                );


            launcher.style.left =
                newLeft + "px";

            launcher.style.top =
                newTop + "px";

        }
    );


    document.addEventListener(
        "mouseup",
        function (event) {

            if (
                event.button === 0
            ) {

                dragging = false;

            }

        }
    );


    window.addEventListener(
        "blur",
        function () {

            dragging = false;

        }
    );


    /* ==========================================
       INITIALIZE
    ========================================== */

    loadTheme();

    loadScripts();

    render();

    updateLines();

})();

</script>

</div>
