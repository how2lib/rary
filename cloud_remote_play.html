<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Remote Play</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: contain;
      background: #000;
      outline: none;
      border: 0;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

<video
  id="video"
  autoplay
  playsinline
  muted
  tabindex="0"
></video>

<script>
const WORKER =
  "https://cloud-remote-play.8nqrblx.workers.dev";

const video =
  document.getElementById("video");

let inputChannel = null;
let pc = null;
let sessionId = null;

function sleep(ms) {
  return new Promise(resolve => {
    setTimeout(resolve, ms);
  });
}

function clamp(value, min = 0, max = 1) {
  return Math.max(min, Math.min(max, value));
}

function sendInput(data) {
  if (
    inputChannel &&
    inputChannel.readyState === "open"
  ) {
    try {
      inputChannel.send(JSON.stringify(data));
    } catch (error) {
      console.error("Input send failed:", error);
    }
  }
}

/* ================================
   MOUSE INPUT
================================ */

function getVideoCoordinates(event) {
  const rect = video.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;

  const vw = video.videoWidth || rect.width;
  const vh = video.videoHeight || rect.height;

  // Account for object-fit: contain letterboxing.
  const scale = Math.min(rect.width / vw, rect.height / vh);
  const rw = vw * scale;
  const rh = vh * scale;
  const ox = (rect.width - rw) / 2;
  const oy = (rect.height - rh) / 2;

  return {
    x: clamp((event.clientX - rect.left - ox) / rw),
    y: clamp((event.clientY - rect.top - oy) / rh)
  };
}

video.addEventListener("mousemove", event => {
  const p = getVideoCoordinates(event);
  if (!p) return;

  sendInput({
    type: "mouse_move",
    x: p.x,
    y: p.y
  });
});

video.addEventListener("mousedown", event => {
  event.preventDefault();
  video.focus();

  const p = getVideoCoordinates(event);
  if (p) {
    sendInput({ type: "mouse_move", x: p.x, y: p.y });
  }

  sendInput({
    type: "mouse_down",
    button: event.button
  });
});

video.addEventListener("mouseup", event => {
  event.preventDefault();

  sendInput({
    type: "mouse_up",
    button: event.button
  });
});

video.addEventListener("wheel", event => {
  event.preventDefault();

  sendInput({
    type: "mouse_wheel",
    deltaX: event.deltaX,
    deltaY: event.deltaY
  });
}, {
  passive: false
});

video.addEventListener("contextmenu", event => {
  event.preventDefault();
});

video.addEventListener("click", () => {
  video.focus();
});

/* ================================
   KEYBOARD INPUT
================================ */

const pressedKeys = new Set();

// Keep the remote-play page as the keyboard owner.
// Do not require the <video> element to remain focused because WebRTC
// video elements can lose focus when the browser processes mouse input.
window.addEventListener("keydown", event => {
  if (event.repeat || pressedKeys.has(event.code)) return;

  pressedKeys.add(event.code);
  event.preventDefault();
  event.stopPropagation();

  sendInput({
    type: "key_down",
    key: event.key,
    code: event.code
  });
}, true);

window.addEventListener("keyup", event => {
  pressedKeys.delete(event.code);
  event.preventDefault();
  event.stopPropagation();

  sendInput({
    type: "key_up",
    key: event.key,
    code: event.code
  });
}, true);

window.addEventListener("blur", () => {
  for (const code of pressedKeys) {
    sendInput({
      type: "key_up",
      key: code,
      code
    });
  }
  pressedKeys.clear();
});

/* ================================
   WEBRTC
================================ */

async function createSession() {
  const response = await fetch(
    WORKER +
    "/session/create?t=" +
    Date.now(),
    {
      method: "POST",
      cache: "no-store"
    }
  );

  if (!response.ok) {
    throw new Error(
      "Session request failed: " +
      response.status
    );
  }

  const data = await response.json();

  if (!data.success || !data.sessionId) {
    throw new Error("Session creation failed");
  }

  return data.sessionId;
}

async function waitForAnswer(id) {
  while (true) {
    const response = await fetch(
      WORKER +
      "/session/" +
      id +
      "?t=" +
      Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (response.ok) {
      const data = await response.json();

      if (
        data.success &&
        data.session &&
        data.session.answer
      ) {
        return data.session.answer;
      }
    }

    await sleep(1000);
  }
}

async function waitForIceGathering(connection) {
  if (
    connection.iceGatheringState ===
    "complete"
  ) {
    return;
  }

  await new Promise(resolve => {
    const check = () => {
      if (
        connection.iceGatheringState ===
        "complete"
      ) {
        connection.removeEventListener(
          "icegatheringstatechange",
          check
        );

        resolve();
      }
    };

    connection.addEventListener(
      "icegatheringstatechange",
      check
    );
  });
}

async function start() {
  try {
    sessionId = await createSession();

    pc = new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

    /* ================================
       REMOTE VIDEO
    ================================= */

    pc.addTransceiver("video", {
      direction: "recvonly"
    });

    pc.ontrack = async event => {
      if (event.track.kind !== "video") {
        return;
      }

      const stream =
        event.streams.length > 0
          ? event.streams[0]
          : new MediaStream([
              event.track
            ]);

      video.srcObject = stream;

      try {
        await video.play();
      } catch (error) {
        console.error(
          "Video playback error:",
          error
        );
      }
    };

    /* ================================
       REMOTE INPUT CHANNEL
    ================================= */

    inputChannel =
      pc.createDataChannel(
        "remote-input"
      );

    inputChannel.onopen = () => {
      console.log(
        "Remote input channel connected"
      );
    };

    inputChannel.onclose = () => {
      console.log(
        "Remote input channel closed"
      );
    };

    inputChannel.onerror = error => {
      console.error(
        "Remote input channel error:",
        error
      );
    };

    /* ================================
       CONNECTION STATE
    ================================= */

    pc.onconnectionstatechange = () => {
      console.log(
        "Connection:",
        pc.connectionState
      );

      if (
        pc.connectionState === "failed"
      ) {
        reconnect();
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log(
        "ICE:",
        pc.iceConnectionState
      );
    };

    /* ================================
       CREATE OFFER
    ================================= */

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    await waitForIceGathering(pc);

    /* ================================
       SEND OFFER
    ================================= */

    const offerResponse =
      await fetch(
        WORKER +
        "/session/" +
        sessionId +
        "/offer",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          cache: "no-store",
          body: JSON.stringify({
            offer:
              pc.localDescription
          })
        }
      );

    if (!offerResponse.ok) {
      throw new Error(
        "Failed to send offer"
      );
    }

    const offerResult =
      await offerResponse.json();

    if (!offerResult.success) {
      throw new Error(
        "Cloud rejected offer"
      );
    }

    /* ================================
       WAIT FOR HOST
    ================================= */

    const answer =
      await waitForAnswer(
        sessionId
      );

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        answer
      )
    );

    console.log(
      "Remote Play connected"
    );

  } catch (error) {
    console.error(
      "Remote Play error:",
      error
    );

    await sleep(2000);
    reconnect();
  }
}

let reconnecting = false;

async function reconnect() {
  if (reconnecting) return;

  reconnecting = true;

  try {
    if (pc) {
      pc.close();
    }
  } catch {}

  pc = null;
  inputChannel = null;
  sessionId = null;

  await sleep(1000);

  reconnecting = false;
  start();
}

/* ================================
   AUTO START
================================ */

window.addEventListener(
  "load",
  () => {
    start();
  }
);
</script>

</body>
</html>
