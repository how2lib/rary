		/* legs: curled while lowering, then unfurl in a ripple */
		var scramble = (1 - prog(t, T.unfurl - 0.4, T.unfurl)) * prog(t, T.dropStart, T.dropStart + 0.4);
		var idle = prog(t, T.unfurl + 1.4, T.unfurl + 2.4) * (1 - zoomE);
		for (var i = 0; i < legs.length; i++) {
			var L = legs[i];
			var open = spring(t - T.unfurl - L.delay, 9, 0.4);
			var curl = t < T.unfurl + L.delay ? 1 : 1 - open;
			for (var k = 0; k < 3; k++) {
				var a = L.dir * CURL[k] * curl
					+ Math.sin(t * 13 + i * 1.7 + k) * 3.5 * scramble
					+ Math.sin(t * 1.9 + i * 0.9 + k * 0.4) * 1.1 * idle;
				L.segs[k].style.transform = 'rotate(' + a.toFixed(2) + 'deg)';
			}
		}

		/* camera = viewBox (vector-sharp at any zoom) */
		var w  = Math.exp(lerp(Math.log(W0), Math.log(W1), zoomE));
		var cx = lerp(217.5, 217.5 + dx, zoomE);
		var cy = lerp(215, y - 8, zoomE);
		svg.setAttribute('viewBox', (cx - w / 2).toFixed(3) + ' ' + (cy - w / 2).toFixed(3) + ' ' + w.toFixed(3) + ' ' + w.toFixed(3));
		svg.style.setProperty('--k', Math.pow(w / W0, 0.55).toFixed(4));

		/* engraved line-work draws in as we approach */
		for (i = 0; i < headLines.length; i++) {
			headLines[i].el.style.strokeDashoffset =
				(headLines[i].L * (1 - ease.inOutCubic(prog(t, T.headLines + i * 0.22, T.headLines + i * 0.22 + 1.1)))).toFixed(2);
		}
		for (i = 0; i < bodyLines.length; i++) {
			bodyLines[i].el.style.strokeDashoffset =
				(bodyLines[i].L * (1 - ease.inOutCubic(prog(t, T.bodyLines + i * 0.16, T.bodyLines + i * 0.16 + 1.0)))).toFixed(2);
		}
		for (i = 0; i < dots.length; i++) {
			var dp = ease.outCubic(prog(t, T.dots + i * 0.022, T.dots + i * 0.022 + 0.45));
			dots[i].style.opacity = dp.toFixed(3);
			dots[i].style.transform = 'scale(' + lerp(.4, 1, dp).toFixed(3) + ')';
		}

		/* eyes: one slow pulse */
		var es = 1 + 0.45 * Math.sin(Math.PI * clamp(t - T.eyes, 0, 1));
		for (i = 0; i < eyes.length; i++) eyes[i].style.transform = 'scale(' + es.toFixed(3) + ')';

		/* final dissolve into the home screen */
		var f = ease.inOutSine(prog(t, T.fade[0], T.fade[1]));
		svg.style.opacity = Math.min(prog(t, T.dropStart - 0.1, T.dropStart + 0.2), 1 - f, 1 - sk);
	}

	/* ---------- run / finish ---------- */
	var started = false, finished = false, revealed = false, t0 = 0, rafId = 0, clockNow = 0;

	function reveal() {
		if (revealed) return;
		revealed = true;
		root.classList.add('intro-reveal');
		intro.style.pointerEvents = 'none';
		intro.style.cursor = 'default';
	}

	function finish() {
		if (finished) return;
		finished = true;
		cancelAnimationFrame(rafId);
		reveal();
		window.removeEventListener('keydown', onKey);
		if (intro.parentNode) intro.parentNode.removeChild(intro);
		/* let the last icon finish rising before dropping the hold-back styles */
		setTimeout(function () { root.classList.remove('js-intro'); }, 1800);
	}

	function frame(ts) {
		if (finished) return;
		if (!started) { started = true; t0 = ts; }
		var t = (ts - t0) / 1000;
		clockNow = t;
		render(t, t);   /* skipAt lives on the same clock */
		if (skipAt === null) {
			if (t >= T.reveal) reveal();
			if (t >= T.end) { finish(); return; }
		} else {
			if (t - skipAt >= SKIP_FADE * 0.45) reveal();
			if (t - skipAt >= SKIP_FADE + 0.05) { finish(); return; }
		}
		rafId = requestAnimationFrame(frame);
	}

	function skip() {
		if (finished || skipAt !== null || revealed) return;
		skipAt = clockNow;
	}
	function onKey(e) {
		if (finished || revealed) return;
		if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
			e.preventDefault();
			skip();
		}
	}
	if (skipB) skipB.addEventListener('click', skip);
	window.addEventListener('keydown', onKey);

	function begin() {
		if (begin.done) return;
		begin.done = true;
		render(0, 0);
		rafId = requestAnimationFrame(frame);
	}

	var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	if (reduce) {
		/* no motion: go straight to the home screen */
		finished = true;
		window.removeEventListener('keydown', onKey);
		root.classList.add('intro-reveal');
		if (intro.parentNode) intro.parentNode.removeChild(intro);
		setTimeout(function () { root.classList.remove('js-intro'); }, 1800);
		return;
	}

	/* wait for the images (ravens, icons) so the dissolve never reveals a half-loaded page */
	if (document.readyState === 'complete') begin();
	else {
		window.addEventListener('load', begin);
		setTimeout(begin, 3500);
	}
	setTimeout(finish, FAILSAFE_MS);
})();

</script>
